server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy all API/Gateway calls to the gateway service ────────────────
    # In Kubernetes the gateway Service is named "urumi-gateway" on port 3003.
    # The GATEWAY_ORIGIN env var can be injected via ConfigMap; default shown here.
    set $gateway_origin http://urumi-gateway:3003;

    location /api/ {
        proxy_pass $gateway_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # SSE / streaming support
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        proxy_pass $gateway_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /user/ {
        proxy_pass $gateway_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /auth/ {
        proxy_pass $gateway_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /mcp {
        proxy_pass $gateway_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # MCP uses SSE for streaming — disable buffering
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }

    # ── SPA fallback: serve index.html for any non-file route ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip for faster static serving
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
