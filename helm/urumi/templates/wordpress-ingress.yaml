apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urumi-wordpress
  labels:
    app.kubernetes.io/name: urumi-wordpress
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - host: {{ .Values.wordpress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urumi-wordpress
                port:
                  number: 80