{{- /* WooCommerce MCP — Deployment + Service (no external Ingress; cluster-internal only) */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-woocommerce-mcp
  labels:
    app.kubernetes.io/name: urumi-woocommerce-mcp
    app.kubernetes.io/component: mcp-upstream
spec:
  replicas: {{ .Values.woocommerceMcp.replicas }}
  selector:
    matchLabels:
      app: urumi-woocommerce-mcp
  template:
    metadata:
      labels:
        app: urumi-woocommerce-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: woocommerce-mcp
          image: {{ .Values.woocommerceMcp.image }}
          imagePullPolicy: {{ .Values.woocommerceMcp.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.woocommerceMcp.port }}
          env:
            - name: WOOCOMMERCE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.woocommerceSecretName }}
                  key: WOOCOMMERCE_BASE_URL
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.woocommerceSecretName }}
                  key: WOOCOMMERCE_CONSUMER_KEY
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.woocommerceSecretName }}
                  key: WOOCOMMERCE_CONSUMER_SECRET
          resources:
            requests:
              cpu: {{ .Values.woocommerceMcp.resources.requests.cpu }}
              memory: {{ .Values.woocommerceMcp.resources.requests.memory }}
            limits:
              cpu: {{ .Values.woocommerceMcp.resources.limits.cpu }}
              memory: {{ .Values.woocommerceMcp.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.woocommerceMcp.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.woocommerceMcp.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: urumi-woocommerce-mcp
  labels:
    app.kubernetes.io/name: urumi-woocommerce-mcp
    app.kubernetes.io/component: mcp-upstream
spec:
  # ClusterIP only — NOT exposed outside the cluster; only the gateway can reach it
  type: ClusterIP
  selector:
    app: urumi-woocommerce-mcp
  ports:
    - port: {{ .Values.woocommerceMcp.port }}
      targetPort: {{ .Values.woocommerceMcp.port }}
      name: mcp-http
