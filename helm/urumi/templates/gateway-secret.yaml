{{- if .Values.secrets.create }}
{{- $gateway := .Values.secrets.gateway | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gatewaySecretName }}
  labels:
    app.kubernetes.io/name: urumi-gateway
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  GATEWAY_KEY_HMAC_SECRET: {{ required "secrets.gateway.hmacSecret is required when secrets.create=true" $gateway.hmacSecret | quote }}
  GATEWAY_ENCRYPTION_KEY: {{ required "secrets.gateway.encryptionKey is required when secrets.create=true" $gateway.encryptionKey | quote }}
  GEMINI_API_KEY: {{ $gateway.geminiApiKey | default "" | quote }}
{{- else }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace .Values.gatewaySecretName }}
{{- if and $existingSecret $existingSecret.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gatewaySecretName }}
  labels:
    app.kubernetes.io/name: urumi-gateway
    app.kubernetes.io/component: gateway
type: Opaque
data:
  {{- range $key, $val := $existingSecret.data }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- end }}
