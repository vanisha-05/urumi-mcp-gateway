apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urumi-wordpress
  template:
    metadata:
      labels:
        app: urumi-wordpress
    spec:
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image | quote }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: urumi-mariadb:3306
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.mariadb.database | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.mariadb.username | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecretName }}
                  key: mariadb-password
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /wp-admin/install.php
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /wp-admin/install.php
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /wp-admin/install.php
              port: http
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: urumi-wordpress-data