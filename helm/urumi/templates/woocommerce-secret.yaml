{{- if .Values.secrets.create }}
{{- $woo := .Values.secrets.woocommerce | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.woocommerceSecretName }}
  labels:
    app.kubernetes.io/name: urumi-woocommerce-mcp
    app.kubernetes.io/component: mcp-upstream
type: Opaque
stringData:
  WOOCOMMERCE_BASE_URL: {{ $woo.baseUrl | default "http://urumi-wordpress" | quote }}
  WOOCOMMERCE_CONSUMER_KEY: {{ required "secrets.woocommerce.consumerKey is required when secrets.create=true" $woo.consumerKey | quote }}
  WOOCOMMERCE_CONSUMER_SECRET: {{ required "secrets.woocommerce.consumerSecret is required when secrets.create=true" $woo.consumerSecret | quote }}
{{- else }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace .Values.woocommerceSecretName }}
{{- if and $existingSecret $existingSecret.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.woocommerceSecretName }}
  labels:
    app.kubernetes.io/name: urumi-woocommerce-mcp
    app.kubernetes.io/component: mcp-upstream
type: Opaque
data:
  {{- range $key, $val := $existingSecret.data }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- end }}
