apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urumi-gateway-ingress
  labels:
    app.kubernetes.io/name: urumi-gateway
    app.kubernetes.io/component: gateway
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - host: {{ .Values.wordpress.host | default "localhost" }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: urumi-gateway
                port:
                  number: {{ .Values.gateway.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: urumi-gateway
                port:
                  number: {{ .Values.gateway.port }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: urumi-gateway
                port:
                  number: {{ .Values.gateway.port }}
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: urumi-gateway
                port:
                  number: {{ .Values.gateway.port }}
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: urumi-gateway
                port:
                  number: {{ .Values.gateway.port }}
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: urumi-gateway
                port:
                  number: {{ .Values.gateway.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: urumi-gateway
                port:
                  number: {{ .Values.gateway.port }}
