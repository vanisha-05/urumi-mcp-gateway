apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: urumi-gateway-pvc
  labels:
    app.kubernetes.io/name: urumi-gateway
    app.kubernetes.io/component: gateway
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.gateway.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: urumi-gateway
  labels:
    app.kubernetes.io/name: urumi-gateway
    app.kubernetes.io/component: gateway
spec:
  selector:
    app: urumi-gateway
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
      name: http
