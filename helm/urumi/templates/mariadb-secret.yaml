{{- if .Values.secrets.create }}
{{- $mariadb := .Values.secrets.mariadb | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.databaseSecretName }}
  labels:
    app.kubernetes.io/name: urumi-mariadb
    app.kubernetes.io/component: database
type: Opaque
stringData:
  mariadb-root-password: {{ required "secrets.mariadb.rootPassword is required when secrets.create=true" $mariadb.rootPassword | quote }}
  mariadb-password: {{ required "secrets.mariadb.password is required when secrets.create=true" $mariadb.password | quote }}
{{- else }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace .Values.databaseSecretName }}
{{- if and $existingSecret $existingSecret.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.databaseSecretName }}
  labels:
    app.kubernetes.io/name: urumi-mariadb
    app.kubernetes.io/component: database
type: Opaque
data:
  {{- range $key, $val := $existingSecret.data }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- end }}
